---
name: tests
on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} - python${{ matrix.python }} - ${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python:
          - '3.14'
        tz:
          - 'utc'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip|${{ hashFiles('setup.py') }}|${{ hashFiles('setup.cfg') }}
      - run: pip install tox
      - run: git submodule update --init --force
      - run: env FAKETIME_COMPILE_CFLAGS="-UFAKE_STAT -UFAKE_UTIME -UFAKE_SLEEP -Wno-unused-function" make -C libfaketime/vendor/libfaketime
        if: runner.os == 'Linux'
      - run: make -C libfaketime/vendor/libfaketime
        if: runner.os == 'macOS'
      - run: tox -e ${{ matrix.python }}-${{ matrix.tz }} --recreate

  style:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pre-commit/action@v3.0.1
